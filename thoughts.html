<script>
  function syncContentDivider() {
    var topDivider = document.querySelector(".navbar .divider");
    var bottomDivider = document.querySelector(".content-divider");
    if (!topDivider || !bottomDivider) return;
    var rect = topDivider.getBoundingClientRect();
    bottomDivider.style.marginLeft = rect.left + "px";
    bottomDivider.style.width = rect.width + "px";
  }
  window.addEventListener("load", syncContentDivider);
  window.addEventListener("resize", syncContentDivider);
</script>
