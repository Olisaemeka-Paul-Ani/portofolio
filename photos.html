<script>
  function syncContentDivider() {
    var topDivider = document.querySelector(".navbar .divider");
    var bottomDivider = document.querySelector(".content-divider");
    if (!topDivider || !bottomDivider) return;
    var rect = topDivider.getBoundingClientRect();
    bottomDivider.style.marginLeft = rect.left + "px";
    bottomDivider.style.width = rect.width + "px";
  }
  window.addEventListener("load", syncContentDivider);
  window.addEventListener("resize", syncContentDivider);
</script>

<script>
  (function () {
    var items = Array.prototype.slice.call(document.querySelectorAll(".photo-item"));
    if (!items.length) return;

    var photos = items.map(function (item) {
      return {
        src: item.querySelector("img").getAttribute("src"),
        alt: item.querySelector("img").getAttribute("alt") || "",
        caption: item.getAttribute("data-caption") || ""
      };
    });

    var lightbox = document.getElementById("lightbox");
    var lightboxImage = document.getElementById("lightbox-image");
    var lightboxCaption = document.getElementById("lightbox-caption");
    var prevBtn = document.getElementById("lightbox-prev");
    var nextBtn = document.getElementById("lightbox-next");
    var closeBtn = document.getElementById("lightbox-close");

    var currentIndex = 0;

    function render(withFlip) {
      var photo = photos[currentIndex];
      if (withFlip) {
        lightboxImage.classList.remove("is-flipping");
        void lightboxImage.offsetWidth;
        lightboxImage.classList.add("is-flipping");
      }
      lightboxImage.src = photo.src;
      lightboxImage.alt = photo.alt;
      lightboxCaption.textContent = photo.caption;
    }

    function open(index) {
      currentIndex = index;
      render(false);
      lightbox.classList.add("is-open");
      document.body.style.overflow = "hidden";
    }

    function close() {
      lightbox.classList.remove("is-open");
      document.body.style.overflow = "";
    }

    function showPrev() {
      currentIndex = (currentIndex - 1 + photos.length) % photos.length;
      render(true);
    }

    function showNext() {
      currentIndex = (currentIndex + 1) % photos.length;
      render(true);
    }

    items.forEach(function (item, index) {
      item.addEventListener("click", function () {
        open(index);
      });
    });

    closeBtn.addEventListener("click", close);
    prevBtn.addEventListener("click", showPrev);
    nextBtn.addEventListener("click", showNext);

    lightbox.addEventListener("click", function (e) {
      if (e.target === lightbox) close();
    });

    document.addEventListener("keydown", function (e) {
      if (!lightbox.classList.contains("is-open")) return;
      if (e.key === "Escape") close();
      if (e.key === "ArrowLeft") showPrev();
      if (e.key === "ArrowRight") showNext();
    });
  })();
</script>
